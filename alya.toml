[package]
name = "webview"
version = "0.1.0"
alya-version = "0.0.19"
entry = "src/lib.alya"
description = "Cross-platform system webview bindings for Alya: WebView2 on Windows, WKWebView on macOS, WebKitGTK on Linux"
authors = ["Alya Language Contributors <https://github.com/alya-lang>"]
license = "MIT"
homepage = "https://github.com/alya-lang/alya"
repository = "https://github.com/alya-lang/webview"
keywords = ["alya", "alya-lang", "package", "webview", "browser", "c", "ffi"]

[dependencies]
# Optional dependencies install only when an active feature names them:
# extra = { git = "https://github.com/alya-lang/extra", tag = "v0.1.0", optional = true }

[build]
c-sources = ["c/webview.c"]
c-sources-windows = ["c/webview_win.c"]
c-sources-macos = ["c/webview_mac.c"]
c-sources-linux = ["c/webview_linux.c"]
c-link-flags-windows = ["-lole32", "-luser32", "-lgdi32", "-lshell32"]
c-link-flags-macos = ["-framework", "Cocoa", "-framework", "WebKit", "-framework", "CoreGraphics"]
c-link-flags-linux = ["-ldl"]
c-flags = ["-O2"]
c-include-dirs = ["c"]
links = "webview"

# Optional: feature-gated API slices. Members name another feature;
# gate the using code with `@cfg(feature = "...")` (see `src/lib.alya`,
# `src/types.alya`, `src/core/events.alya` and `src/native/browser.alya`).
# `default` is active unless the caller passes `--no-default-features`;
# select features explicitly via
# `alya build/run/test/bench/install --features <a,b>`.
[features]
default = ["window", "navigation", "scripting", "settings", "input", "inspection", "storage_media", "events"]
# Lifecycle and window chrome; needs nothing else.
window = []
# Navigation drives windows and reports completion through the event loop.
navigation = ["window", "events"]
# Scripting pumps JS results through the event loop.
scripting = ["window", "events"]
# Engine and profile settings apply to open windows.
settings = ["window"]
# Synthetic input posts to open windows.
input = ["window"]
# Page readers run JS through eval_wait.
inspection = ["window", "scripting"]
# Storage/scroll/media writers run JS through eval.
storage_media = ["window", "scripting"]
# Queue, pump and drain primitives are null-safe without a window, but the
# slice implies window so live tests and demos can open event sources.
events = ["window"]

